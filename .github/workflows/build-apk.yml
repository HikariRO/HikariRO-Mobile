name: Build HikariRO Mobile 0.19

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout HikariRO Mobile
        uses: actions/checkout@v4

      - name: Checkout official Winlator source
        run: git clone --recursive --depth 1 https://github.com/brunodev85/winlator.git winlator

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          python3 -m pip install --quiet pillow

      - name: Apply HikariRO customization
        run: python3 scripts/customize.py

      - name: Apply ARM64 native loader workaround
        run: python3 scripts/patch_010.py

      - name: Apply clean 0.19 version and launch policy
        run: python3 scripts/patch_019_clean.py

      - name: Build ARM64 APK
        working-directory: winlator/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and rename APK
        run: |
          cp winlator/app/app/build/outputs/apk/debug/app-debug.apk HikariRO-Mobile-0.19-FRESH.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs HikariRO-Mobile-0.19-FRESH.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging HikariRO-Mobile-0.19-FRESH.apk | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HikariRO-Mobile-0.19-FRESH
          path: HikariRO-Mobile-0.19-FRESH.apk
          if-no-files-found: error
          retention-days: 30
