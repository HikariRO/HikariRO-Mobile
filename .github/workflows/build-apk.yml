name: Build private APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout HikariRO Mobile
        uses: actions/checkout@v4

      - name: Checkout official Winlator source
        run: git clone --recursive --depth 1 https://github.com/brunodev85/winlator.git winlator

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          python3 -m pip install --quiet pillow

      - name: Apply HikariRO customization
        run: python3 scripts/customize.py

      - name: Apply 0.10 native loader workaround
        run: python3 scripts/patch_010.py

      - name: Apply 0.11 Android PID and background fix
        run: python3 scripts/patch_011.py

      - name: Apply 0.12 persistent diagnostics and full background
        run: python3 scripts/patch_012.py

      - name: Apply 0.13 direct Wine launch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          root = Path('winlator/app')
          build = root / 'app/build.gradle'
          text = build.read_text(encoding='utf-8')
          text = re.sub(r'versionCode\s+[^\n]+', 'versionCode Integer.parseInt("13")', text, count=1)
          text = re.sub(r'versionName\s+[^\n]+', 'versionName String.valueOf("0.13.0-beta")', text, count=1)
          build.write_text(text, encoding='utf-8')
          for rel in ['app/src/main/java/com/winlator/HikariDiagnostics.java','app/src/main/java/com/winlator/HikariStartupDialog.java','app/src/main/java/com/winlator/HikariLauncherActivity.java']:
              p = root / rel
              p.write_text(p.read_text(encoding='utf-8').replace('0.12','0.13'), encoding='utf-8')
          guest = root / 'app/src/main/java/com/winlator/xenvironment/components/GuestProgramLauncherComponent.java'
          text = guest.read_text(encoding='utf-8')
          needle = '        File box64File = new File(rootDir, "/usr/local/bin/box64");'
          insert = base64.b64decode('').decode()
          if needle not in text:
              raise RuntimeError('missing insertion point')
          text = text.replace(needle, insert, 1)
          text = text.replace('box64File.getAbsolutePath()+" "+guestExecutable', 'box64File.getAbsolutePath()+" "+launchExecutable')
          text = text.replace('" guestExecutable=" + guestExecutable', '" guestExecutable=" + launchedExecutable')
          marker = '        HikariDiagnostics.record(environment.getContext(), "Comando Box64/Wine preparado: " + command);\n'
          if marker not in text:
              raise RuntimeError('missing process marker')
          text = text.replace(marker, marker + '        final String launchedExecutable = launchExecutable;\n', 1)
          guest.write_text(text, encoding='utf-8')
          PY

      - name: Apply 0.14 Wine loader and fullscreen artwork fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageStat

          root = Path('winlator/app')

          build = root / 'app/build.gradle'
          text = build.read_text(encoding='utf-8')
          text = re.sub(r'versionCode\s+[^\n]+', 'versionCode Integer.parseInt("14")', text, count=1)
          text = re.sub(r'versionName\s+[^\n]+', 'versionName String.valueOf("0.14.0-beta")', text, count=1)
          build.write_text(text, encoding='utf-8')

          for rel in [
              'app/src/main/java/com/winlator/HikariDiagnostics.java',
              'app/src/main/java/com/winlator/HikariStartupDialog.java',
              'app/src/main/java/com/winlator/HikariLauncherActivity.java',
          ]:
              p = root / rel
              p.write_text(p.read_text(encoding='utf-8').replace('0.13', '0.14'), encoding='utf-8')

          guest = root / 'app/src/main/java/com/winlator/xenvironment/components/GuestProgramLauncherComponent.java'
          text = guest.read_text(encoding='utf-8')
          old = '''            launchExecutable = "wine cmd /c \\\"E: && cd \\\\HikariRO && raghikari.exe\\\"";'''
          new = '''            File wine64 = new File(rootDir, rootFS.getWinePath()+"/bin/wine64");
            File wine64Preloader = new File(rootDir, rootFS.getWinePath()+"/bin/wine64-preloader");
            File winePreloader = new File(rootDir, rootFS.getWinePath()+"/bin/wine-preloader");
            HikariDiagnostics.record(environment.getContext(), "wine64=" + wine64.getAbsolutePath() + " exists=" + wine64.isFile() + " size=" + (wine64.isFile() ? wine64.length() : 0));
            HikariDiagnostics.record(environment.getContext(), "wine64-preloader=" + wine64Preloader.getAbsolutePath() + " exists=" + wine64Preloader.isFile());
            HikariDiagnostics.record(environment.getContext(), "wine-preloader=" + winePreloader.getAbsolutePath() + " exists=" + winePreloader.isFile());
            File selectedWineLoader = wine64.isFile() ? wine64 : wineBinary;
            launchExecutable = selectedWineLoader.getAbsolutePath() + " cmd /c \\\"E: && cd \\\\HikariRO && raghikari.exe\\\"";
            HikariDiagnostics.record(environment.getContext(), "Wine loader seleccionado=" + selectedWineLoader.getAbsolutePath());'''
          if old not in text:
              raise RuntimeError('No se encontro launchExecutable de 0.13')
          text = text.replace(old, new, 1)
          guest.write_text(text, encoding='utf-8')

          # The supplied artwork contains a large black lower area. Detect the last scenic row,
          # crop only the actual landscape and scale it to a real 16:9 fullscreen drawable.
          img_path = root / 'app/src/main/res/drawable/hikariro_launcher_background.png'
          img = Image.open(img_path).convert('RGB')
          w, h = img.size
          last = 0
          sample_step = max(1, w // 320)
          for y in range(h):
              row = img.crop((0, y, w, y + 1)).resize((max(1, w // sample_step), 1))
              pixels = list(row.getdata())
              bright = sum(1 for r,g,b in pixels if max(r,g,b) > 35 and (r+g+b) > 90)
              if bright >= max(3, len(pixels) // 20):
                  last = y
          crop_bottom = min(h, max(180, last + 1))
          scenic = img.crop((0, 0, w, crop_bottom))
          scenic = scenic.resize((1920, 1080), Image.Resampling.LANCZOS)
          scenic.save(img_path, 'PNG', optimize=True)
          print('0.14 background:', (w,h), 'crop_bottom=', crop_bottom, '->', scenic.size)

          # Fill the activity: no FIT_CENTER bars and no dark cover over the scenery.
          for rel in [
              'app/src/main/java/com/winlator/HikariLauncherActivity.java',
              'app/src/main/java/com/winlator/HikariStartupDialog.java',
          ]:
              p = root / rel
              s = p.read_text(encoding='utf-8')
              s = s.replace('ImageView.ScaleType.FIT_CENTER', 'ImageView.ScaleType.CENTER_CROP')
              s = s.replace('shade.setBackgroundColor(0x22030b1d);', 'shade.setBackgroundColor(0x22000000);')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Build ARM64 private APK
        working-directory: winlator/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp winlator/app/app/build/outputs/apk/debug/app-debug.apk HikariRO-Mobile-0.14-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HikariRO-Mobile-0.14-beta
          path: HikariRO-Mobile-0.14-beta.apk
          if-no-files-found: error
          retention-days: 30
