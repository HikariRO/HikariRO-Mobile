name: Build private APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout HikariRO Mobile
        uses: actions/checkout@v4

      - name: Checkout official Winlator source
        run: git clone --recursive --depth 1 https://github.com/brunodev85/winlator.git winlator

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Apply HikariRO customization
        run: python3 scripts/customize.py

      - name: Apply 0.8 Box64 runtime repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("winlator/app")
          build = root / "app/build.gradle"
          text = build.read_text(encoding="utf-8")
          text = re.sub(r"versionCode\s+\d+", "versionCode 8", text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "0.8.0-beta"', text, count=1)
          build.write_text(text, encoding="utf-8")

          diagnostics = root / "app/src/main/java/com/winlator/HikariDiagnostics.java"
          text = diagnostics.read_text(encoding="utf-8")
          old = '        record(context, "Inicio del diagnóstico 0.7");'
          new = ('        androidx.preference.PreferenceManager.getDefaultSharedPreferences(context)'
                 '.edit().remove("current_box64_version").commit();\n'
                 '        record(context, "Inicio del diagnóstico 0.8");\n'
                 '        record(context, "Runtime Box64 marcado para revalidación");')
          if old not in text:
              raise RuntimeError("No se encontró el punto de reparación de Box64")
          diagnostics.write_text(text.replace(old, new, 1), encoding="utf-8")

          startup = root / "app/src/main/java/com/winlator/HikariStartupDialog.java"
          text = startup.read_text(encoding="utf-8")
          text = text.replace("HikariRO Mobile 0.7\\n", "HikariRO Mobile 0.8\\n")
          text = text.replace(
              "Puedes reintentar o activar el modo compatible para Mali.",
              "Pulsa Copiar diagnóstico para revisar el punto exacto del fallo. El modo compatible solo afecta a problemas gráficos."
          )
          startup.write_text(text, encoding="utf-8")

          xserver = root / "app/src/main/java/com/winlator/XServerDisplayActivity.java"
          text = xserver.read_text(encoding="utf-8")
          text = text.replace(
              'preloaderDialog.setStageOnUiThread("Box64 iniciado; esperando la ventana del juego");',
              'preloaderDialog.setStageOnUiThread("Box64 solicitado; verificando proceso y esperando la ventana del juego");'
          )
          xserver.write_text(text, encoding="utf-8")
          PY

      - name: Build ARM64 private APK
        working-directory: winlator/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp winlator/app/app/build/outputs/apk/debug/app-debug.apk HikariRO-Mobile-0.8-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HikariRO-Mobile-0.8-beta
          path: HikariRO-Mobile-0.8-beta.apk
          if-no-files-found: error
          retention-days: 30
