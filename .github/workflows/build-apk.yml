name: Build HikariRO Mobile 0.21

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout HikariRO Mobile
        uses: actions/checkout@v4

      - name: Checkout official Winlator source
        run: git clone --recursive --depth 1 https://github.com/brunodev85/winlator.git winlator

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          python3 -m pip install --quiet pillow

      - name: Apply HikariRO customization
        run: python3 scripts/customize.py

      - name: Apply ARM64 native loader workaround
        run: python3 scripts/patch_010.py

      - name: Apply Android 16 PID fix
        run: python3 scripts/patch_020_pid.py

      - name: Apply real Wine loader preserving WinHandler
        run: python3 scripts/patch_021_wine_loader.py

      - name: Build ARM64 APK
        working-directory: winlator/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and prepare signing kit
        run: |
          cp winlator/app/app/build/outputs/apk/debug/app-debug.apk HikariRO-Mobile-0.21-unsigned.apk
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" apksigner-34.0.0.jar
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose HikariRO-Mobile-0.21-unsigned.apk
          test -s apksigner-34.0.0.jar

      - name: Upload unsigned APK and official signing tool
        uses: actions/upload-artifact@v4
        with:
          name: HikariRO-Mobile-0.21-signing-kit
          path: |
            HikariRO-Mobile-0.21-unsigned.apk
            apksigner-34.0.0.jar
          if-no-files-found: error
          retention-days: 7
